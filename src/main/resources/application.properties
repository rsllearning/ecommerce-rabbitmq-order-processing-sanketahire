# Application Server Port
server.port=8080

# RabbitMQ Broker Connection Settings
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.virtual-host=/

# RabbitMQ Topologies
rabbitmq.exchange.orders=orders_exchange
rabbitmq.exchange.dlx=orders_dlx
rabbitmq.queue.inventory=inventory_queue
rabbitmq.queue.analytics=analytics_queue
rabbitmq.queue.dlq=dead_letter_queue

# Routing Keys
rabbitmq.routing.inventory=order.created.*
rabbitmq.routing.analytics=order.created.electronics
rabbitmq.routing.dlx=#
